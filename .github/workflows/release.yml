# AegisGate Scanner — Release Workflow
# ============================================================================
# Triggers: tag push (v*) or manual dispatch
# Jobs: build-lite → build-ml → sbom → build-container → sign-container → release
# Signing: keyless (Sigstore/Fulcio + Rekor) via GitHub OIDC
# SBOM: CycloneDX + SPDX via anchore/sbom-action
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.1.0)'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read
  attestations: write

env:
  GO_VERSION: '1.27.3'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/aegisgate-scanner

jobs:
  # ========================================
  # Build binaries — non-CGO (heuristic-only)
  # ========================================
  build-lite:
    name: Build Lite (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Platform (for go.mod replace)
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-platform
          path: ./aegisgate-platform
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update go.mod replace for platform
        run: go mod edit -replace github.com/aegisgatesecurity/aegisgate-platform=./aegisgate-platform -replace github.com/aegisgatesecurity/aegisgate-scanner=.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          go build -ldflags "-s -w -X main.Version=${VERSION}" \
            -o aegisgate-scanner-${{ matrix.suffix }} ./cmd/aegisgate-scanner/
      - name: Generate SHA256 checksum
        run: |
          sha256sum aegisgate-scanner-${{ matrix.suffix }} > aegisgate-scanner-${{ matrix.suffix }}.sha256
      - name: Set up Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign binary (keyless)
        run: |
          cosign sign-blob --yes --bundle aegisgate-scanner-${{ matrix.suffix }}.bundle aegisgate-scanner-${{ matrix.suffix }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scanner-lite-${{ matrix.suffix }}
          path: |
            aegisgate-scanner-${{ matrix.suffix }}
            aegisgate-scanner-${{ matrix.suffix }}.sha256
            aegisgate-scanner-${{ matrix.suffix }}.bundle

  # ========================================
  # Build binary — CGO (ML-enabled)
  # ========================================
  build-ml:
    name: Build ML (${{ matrix.goarch }})
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
            suffix: linux-amd64-ml
          - goarch: arm64
            runner: ubuntu-24.04-arm
            suffix: linux-arm64-ml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Platform (for go.mod replace)
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-platform
          path: ./aegisgate-platform
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update go.mod replace for CI
        run: go mod edit -replace github.com/aegisgatesecurity/aegisgate-platform=./aegisgate-platform -replace github.com/aegisgatesecurity/aegisgate-scanner=.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build (CGO, ${{ matrix.goarch }})
        env:
          CGO_ENABLED: 1
          GOARCH: ${{ matrix.goarch }}
          CGO_CFLAGS: "-I${{ github.workspace }}/internal/onnxruntime_go"
          CGO_LDFLAGS: "-L${{ github.workspace }}/lib/${{ matrix.goarch }} -lonnxruntime -ldl"
          ONNXRUNTIME_SHARED_LIBRARY_PATH: ${{ github.workspace }}/lib/${{ matrix.goarch }}/libonnxruntime.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib/${{ matrix.goarch }}
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          go build -ldflags "-s -w -X main.Version=${VERSION}" \
            -o aegisgate-scanner-${{ matrix.suffix }} ./cmd/aegisgate-scanner/
      - name: Generate SHA256 checksum
        run: |
          sha256sum aegisgate-scanner-${{ matrix.suffix }} > aegisgate-scanner-${{ matrix.suffix }}.sha256
      - name: Set up Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign binary (keyless)
        run: |
          cosign sign-blob --yes --bundle aegisgate-scanner-${{ matrix.suffix }}.bundle aegisgate-scanner-${{ matrix.suffix }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scanner-ml-${{ matrix.suffix }}
          path: |
            aegisgate-scanner-${{ matrix.suffix }}
            aegisgate-scanner-${{ matrix.suffix }}.sha256
            aegisgate-scanner-${{ matrix.suffix }}.bundle

  # ========================================
  # SBOM — CycloneDX + SPDX
  # ========================================
  sbom:
    name: Generate SBOM
    needs: [build-lite, build-ml]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          format: spdx-json
          output-file: sbom-spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-files
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json

  # ========================================
  # Docker build + push + sign
  # ========================================
  build-container:
    name: Build & Sign Container
    needs: [build-ml]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      actions: read
      contents: read
      attestations: write
    outputs:
      image_digest: ${{ steps.docker_build.outputs.digest }}
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7
      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push (multi-arch)
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ml
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set up Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign container image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "Signing image: ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"
      - name: Verify container signature
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer-regexp "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"
          echo "✅ Container signature verified"

  # ========================================
  # SBOM Attestation to container image
  # ========================================
  sbom-attest:
    name: SBOM Attestation
    needs: [build-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      COSIGN_EXPERIMENTAL: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.19.0
          syft version
      - name: Generate SBOM (SPDX-JSON)
        run: |
          syft dir:. -o spdx-json > sbom.spdx.json 2>/dev/null
          if [ ! -s sbom.spdx.json ]; then
            echo "::error::SBOM file is empty or missing"
            exit 1
          fi
          echo "✅ SBOM generated: $(wc -l < sbom.spdx.json) lines"
          python3 -c "import json; json.load(open('sbom.spdx.json')); print('SBOM JSON valid')"
      - name: Set up Cosign
        uses: sigstore/cosign-installer@v3
      - name: Attest SBOM to image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          IMAGE_DIGEST: ${{ needs.build-container.outputs.image_digest }}
        run: |
          if [ -n "${IMAGE_DIGEST}" ]; then
            IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          else
            IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          fi
          echo "Attesting SBOM to: ${IMAGE_REF}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE_REF}"
      - name: Verify SBOM attestation
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          IMAGE_DIGEST: ${{ needs.build-container.outputs.image_digest }}
        run: |
          if [ -n "${IMAGE_DIGEST}" ]; then
            IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          else
            IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          fi
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer-regexp "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"
          echo "✅ SBOM attestation verified"

  # ========================================
  # GitHub Release — collect all artifacts
  # ========================================
  create-release:
    name: Create GitHub Release
    needs: [build-lite, build-ml, sbom, build-container, sbom-attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          pattern: scanner-*
      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          name: sbom-files
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/scanner-lite-*/*
            release/scanner-ml-*/*
            release/sbom-files/*
